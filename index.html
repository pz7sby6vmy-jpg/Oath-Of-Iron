.tile{aspect-ratio:auto;min-height:0;width:100%;height:100%;display:block;box-shadow:inset 0 0 5px #1113}.tile.move{box-shadow:inset 0 0 0 1px #a6efff,inset 0 0 0 100px #258fe24a}.token,.token.enemy{position:absolute;inset:0;display:block;width:100%;height:100%;min-height:0}.token img{position:absolute;bottom:2px;left:0;width:100%;height:110%;object-fit:contain;object-position:center bottom}.token .tinyhp{height:5px;bottom:1px;left:12%;right:12%;border-color:#70cfff}.token.enemy .tinyhp{border-color:#ff8876}.tile .tag{font-size:clamp(7px,.65vw,10px);top:1px;right:2px}
.statline,.growthline{border-bottom-color:#d8bd7c38}.statline strong,.growthline strong{font-variant-numeric:tabular-nums;font-weight:normal}.growthbar{background:#1c2936;border-color:#a99c80}.growthbar i{box-shadow:inset 0 1px 1px #f5ffd8}
.equipmentrow,.trait{border-bottom-color:#c9ab6d40}.footer.gamefooter{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(#20374c,#0b1725);border:1px solid #c8a15e;padding:9px 12px;text-align:left;color:#eee1c5;font-size:13px}.gamefooter small{color:#d1bc96}
@media(min-width:1150px){.royalgrid{grid-template-columns:minmax(180px,22fr) minmax(0,44fr) minmax(0,34fr);grid-template-rows:auto auto;gap:7px}.herohero{min-height:0;height:100%;align-self:stretch}.board{aspect-ratio:12/7.4}.rosterpanel .unitcard{min-height:clamp(76px,6.5vw,106px)}.rosterpanel .unitcard img{height:clamp(76px,6.5vw,106px)}.statline,.growthline{min-height:clamp(25px,2vw,32px)}.equipmentcol .panel{padding:10px}.chronicle .log{max-height:52px}.battlepanel .controls button{font-size:12px}.heroart{inset:0 29% 0 0;background-position:center 24%}.heroidentity{width:44%}.rosterpanel{align-self:stretch}.rosterpanel .roster{gap:6px}.heroidentity h2{font-size:clamp(27px,2.6vw,43px)}}
@media(max-width:620px){.herohero{min-height:215px}.rosterpanel .unitcard{min-width:0}.unitcard .info{min-width:0}.unitcard strong{font-size:13px}.unitcard .muted{font-size:10px}.royalnav nav{scrollbar-width:thin}.controls button{min-height:36px}.gamefooter{flex-wrap:wrap}.panel:after{background-size:18px 18px}.growthpanel h2 small{font-size:11px}}
@media(min-width:1150px){.board{aspect-ratio:12/6.7}.rosterpanel{display:flex;flex-direction:column}.rosterpanel .roster{flex:1;grid-template-rows:repeat(6,minmax(0,1fr))}.rosterpanel .unitcard{height:100%;min-height:0}.rosterpanel .unitcard img{height:100%;min-height:0;max-height:125px}.statline,.growthline{min-height:29px}.equipmentrow{padding:3px 4px}.trait{padding:4px 5px}.equipmentcol .panel{padding:9px}.herohero{min-height:0}.gamefooter{margin-top:7px}}

function reach(u){let m=new Map();if(!u||!alive(u))return m;let q=[[u.x,u.y,0]];m.set(u.x+','+u.y,0);while(q.length){let [x,y,c]=q.shift();if(c!==m.get(x+','+y))continue;for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let a=x+dx,b=y+dy;if(a<0||a>=W||b<0||b>=H)continue;let n=c+cost(a,b),k=a+','+b,o=at(a,b);if(n>u.mov||(o&&o.id!==u.id&&o.side!==u.side)||(m.has(k)&&m.get(k)<=n))continue;m.set(k,n);q.push([a,b,n])}}for(let k of [...m.keys()]){let [x,y]=k.split(',').map(Number),o=at(x,y);if(o&&o.id!==u.id)m.delete(k)}return m}

$('roster').innerHTML='';for(let h of S.units.filter(x=>x.side==='ally')){let b=document.createElement('button');b.className='unitcard '+(h.id===selected?'selected ':'')+(!alive(h)?'dead ':h.done?'spent ':'');b.innerHTML=`${img(h)}<div class="info"><strong>${h.name}</strong><div class="muted">${h.cls} · Lv ${h.level}</div><div class="hpbar"><i style="width:${100*h.hp/h.maxhp}%"></i></div><div class="muted">${h.hp}/${h.maxhp} HP ${!alive(h)?'· Fallen':h.done?'· Done':''}</div></div>`;b.onclick=()=>{if(!busy){selected=h.id;mode='move';render();say(h.done?'This hero has acted.':'Selected '+h.name)}};$('roster').append(b)}
renderProfile(u);$('log').innerHTML=S.log.map(t=>`<div>${t}</div>`).join('');$('moveBtn').disabled=!usable||u.moved;$('attackBtn').disabled=!usable;$('healBtn').disabled=!usable||u.cls!=='Cleric';$('waitBtn').disabled=!usable;$('undoBtn').disabled=!usable||!u.moved||!u.origin;$('endBtn').disabled=busy||S.phase!=='player'||S.status!=='playing';$('saveBtn').disabled=busy;$('menuBtn').disabled=busy;}
function clickTile(x,y){if(busy||S.status!=='playing'||S.phase!=='player')return;let u=active(),o=at(x,y),usable=u&&u.side==='ally'&&!u.done&&alive(u);if(usable&&o&&canHeal(u,o)&&mode==='heal'){heal(u,o);return}if(usable&&o&&canHit(u,o)&&mode!=='heal'){preview(u,o);return}if(o){selected=o.id;mode='move';render();say(o.side==='enemy'?'Enemy inspected. Select an ally to act.':o.name+' selected.');return}if(usable&&!u.moved&&mode==='move'&&reach(u).has(x+','+y)){u.origin=[u.x,u.y];u.x=x;u.y=y;u.moved=true;render();save();say('Choose an enemy, heal, or wait.');return}say('That tile is not available.');}
function modal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}
function preview(a,b){let counter=b.hp>damage(a,b)&&canHit(b,a);modal(`<div class="eyebrow">Combat forecast</div><h2>${a.name} vs ${b.name}</h2><div class="gain"><span>Damage / hit</span><strong>${damage(a,b)} · ${hitChance(a,b)}%</strong></div><div class="gain"><span>Enemy counter</span><strong>${counter?damage(b,a)+' · '+hitChance(b,a)+'%':'None expected'}</strong></div><div class="gain"><span>Follow-up</span><strong>${a.spd-b.spd>=4?'You':b.spd-a.spd>=4&&canHit(b,a)?'Enemy':'None'}</strong></div><p>Critical chance: ${critChance(a,b)}%</p><button id="confirmAttack" class="primary">Attack</button> <button id="cancelAttack">Cancel</button>`);$('cancelAttack').onclick=closeModal;$('confirmAttack').onclick=()=>{closeModal();fight(a,b);a.done=true;finishAction()}}
function critChance(a,b){return clamp(Math.floor(a.dex/2)+a.luck-b.luck,0,35)}
function strike(a,b){if(!alive(a)||!alive(b))return;if(Math.random()*100>=hitChance(a,b)){log(a.name+' missed '+b.name+'.');return}let crit=Math.random()*100<critChance(a,b),d=damage(a,b)*(crit?3:1);b.hp=Math.max(0,b.hp-d);log(`${a.name} ${crit?'critically hit':'hit'} ${b.name} for ${d}.`);if(!alive(b))log(b.name+' fell.');}
function gain(u,n){if(u.side!=='ally'||!alive(u)||u.level>=20)return;u.xp+=n;while(u.xp>=100&&u.level<20){u.xp-=100;u.level++;let changes=[];for(let i=0;i<keys.length;i++){if(Math.random()*100<u.growth[i]){u[keys[i]]++;if(i===0)u.hp++;changes.push(names[i])}}queue.push({name:u.name,level:u.level,changes});log(`${u.name} reached level ${u.level} (+${changes.length} stats).`)}if(u.level===20)u.xp=0;}
function fight(a,b){strike(a,b);if(canHit(b,a))strike(b,a);if(alive(a)&&alive(b)&&a.spd-b.spd>=4)strike(a,b);else if(alive(a)&&alive(b)&&b.spd-a.spd>=4&&canHit(b,a))strike(b,a);let h=a.side==='ally'?a:b,e=a.side==='enemy'?a:b;if(alive(h))gain(h,!alive(e)?100:35)}
function heal(a,b){let n=Math.min(b.maxhp-b.hp,5+a.mag);b.hp+=n;a.done=true;gain(a,45);log(`${a.name} healed ${b.name} for ${n}.`);finishAction()}
function status(){if(!S.units.some(u=>u.side==='ally'&&alive(u)))S.status='lost';else if(!S.units.some(u=>u.side==='enemy'&&alive(u)))S.status=S.gameMode!=='endless'&&S.chapter===maps.length-1?'complete':'won';}
function finishAction(){mode='move';status();render();save();say('Action complete. Choose another hero or end turn.');drain()}
function drain(){if(queue.length){let g=queue.shift();modal(`<div class="eyebrow">A hero grows stronger</div><h2>LEVEL UP!</h2><img class="levelportrait" src="${portraits[g.name]}" alt="${g.name}"><p>${g.name} · Level ${g.level-1} → ${g.level}</p>${names.map(n=>`<div class="gain"><span>${n}</span><strong>${g.changes.includes(n)?'+1':'—'}</strong></div>`).join('')}<p>${g.changes.length?`Gained ${g.changes.length} stat points.`:'No stat increases this level.'}</p><button id="nextModal" class="primary">Continue</button>`);$('nextModal').onclick=()=>{closeModal();drain()};return}if(S.status!=='playing')result()}
function result(){let win=S.status==='won',complete=S.status==='complete';modal(`<div class="eyebrow">${win||complete?'Victory':'Defeat'}</div><h2>${win?'Battle won':complete?'The oath fulfilled':'The banner has fallen'}</h2><p>${win?'Your surviving heroes carry their growth into the next chapter.':complete?'You have defeated all three enemy armies.':'Your warband was defeated. Start a new campaign to try again.'}</p><button id="resultBtn" class="primary">${win?'Next chapter':'Main menu'}</button>`);$('resultBtn').onclick=()=>{closeModal();if(win){S.chapter++;setupChapter();render();save();say('A new battle begins.')}else showMenu()}}
function chooseAI(e){let allies=S.units.filter(u=>u.side==='ally'&&alive(u));if(!allies.length)return;let positions=[...reach(e).keys()].map(k=>k.split(',').map(Number));let best=null;for(let [x,y] of positions){let p={...e,x,y};for(let h of allies){let d=dist(p,h);let can=d>=e.min&&d<=e.max;let score=can?100+damage(p,h)*2+(damage(p,h)>=h.hp?35:0)-h.hp*.1+cover(p): -Math.abs(d-e.max)*5+cover(p);if(!best||score>best.score)best={x,y,h,can,score}}}if(best){e.x=best.x;e.y=best.y;if(best.can)fight(e,best.h)}}
function endTurn(){if(busy||S.status!=='playing')return;busy=true;S.phase='enemy';render();say('Enemy units are moving…');let enemies=S.units.filter(u=>u.side==='enemy'&&alive(u)),i=0;function step(){if(i<enemies.length&&S.units.some(u=>u.side==='ally'&&alive(u))){let e=enemies[i++];if(alive(e))chooseAI(e);render();setTimeout(step,battleDelay())}else{S.turn++;S.phase='player';for(let u of S.units){u.done=u.moved=false;delete u.origin}busy=false;status();if(!alive(active()||{hp:0})||active()?.side!=='ally')selected=S.units.find(u=>u.side==='ally'&&alive(u))?.id;finishAction()}}setTimeout(step,battleDelay())}

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const difficultyOptions=d=>['Normal','Hard','Iron'].map(x=>`<option ${x===d?'selected':''}>${x}</option>`).join('');
function button(label,action,extra=''){return `<button class="crown-button ${extra}" data-action="${action}">${label}</button>`}
function menuPanel(title,body,actions=''){return `<section class="crown-panel"><h2>${title}</h2>${body}<div class="menu-actions">${button('← Back','home')}${actions}</div></section>`}
function choosePage(p){page=p;drawMenu();window.scrollTo(0,0)}
function drawMenu(){const root=$('menuContent');let c=read(SAVE,null),e=read(ENDSAVE,null);if(page==='home'){root.innerHTML=`<div class="menu-home"><div class="menu-art"><p>Raise your banner. Forge your legend.</p></div><nav class="menu-list" aria-label="Main menu">${[['⚔','Campaign','Lead your warband through the story.','campaign'],['∞','Endless Mode','Survive ever-changing battlefields.','endless'],['♜','Classes','Discover heroes, roles and growth rates.','classes'],['♛','Leaderboard','Compare your best campaign and endless runs.','leaderboard'],['⚙','Settings','Customize your game experience.','settings']].map(x=>`<button class="menu-choice" data-action="${x[3]}"><span class="emblem">${x[0]}</span><span><strong>${x[1]}</strong><small>${x[2]}</small></span><span>›</span></button>`).join('')}</nav></div>`;return}
if(page==='campaign'){let m=maps[chapterPreview];root.innerHTML=menuPanel('⚔ Campaign',`<div class="sub-grid"><div class="chapter-list">${maps.map((x,i)=>button(`Chapter ${i+1} · ${x.name}`,`chapter:${i}`,i===chapterPreview?'on':'')).join('')}</div><div class="menu-copy"><h3>${m.name}</h3><p>${m.objective}. Command your heroes through three connected battles and carry their stat growth forward.</p><p class="menu-hint">${c?`Saved campaign: Chapter ${c.chapter+1} · ${esc(c.status)}`:'No campaign save yet.'} Chapter list is a preview; a new campaign starts at Chapter 1.</p></div></div>`,`${c?button('Continue campaign','resume:campaign'):''}${button('New campaign','setup:campaign','primary')}`);return}
if(page==='endless'){root.innerHTML=menuPanel('∞ Endless Mode',`<div class="menu-copy"><h3>An unending gauntlet</h3><p>Face progressively stronger enemies, keep your party's growth and discover a new battlefield every wave. Each victory changes the theme and terrain layout.</p></div><div class="setup-row"><strong>Map theme</strong><span>Random · changes every wave</span></div><div class="theme-grid">${themes.map((t,i)=>`<div class="theme-card"><img src="${themeImages[i]}" alt=""><span>${t[0]}</span></div>`).join('')}</div><div class="setup-row"><strong>Enemy scaling</strong><span>Progressive</span></div><div class="menu-hint">${e?`Saved endless run: Wave ${e.chapter+1} · ${esc(e.status)}`:'No endless save yet.'}</div>`,`${e?button('Continue endless','resume:endless'):''}${button('Begin endless','setup:endless','primary')}`);return}
if(page==='setup'){root.innerHTML=menuPanel(setupMode==='endless'?'∞ Prepare your warband':'⚔ Prepare your campaign',`<div class="setup-row"><strong>Difficulty</strong><select id="draftDiff">${difficultyOptions(draftDiff)}</select></div><div class="setup-row"><strong>Classic mode · fallen heroes stay dead</strong><input id="draftClassic" type="checkbox" ${draftClassic?'checked':''}></div><div class="setup-row"><strong>Starting party · ${party.size} / 6 heroes</strong><div>${button('Select all','all')} ${button('Clear','clear')}</div></div><div class="party-grid">${defs.map((d,i)=>`<button class="party-card crown-button ${party.has(i)?'on':''}" data-action="party:${i}" aria-pressed="${party.has(i)}"><img src="${portraits[d[0]]}" alt=""><strong>${d[1]}</strong><small>${d[0]}</small></button>`).join('')}</div><p class="menu-hint">Choose 1–6 heroes. Enemy numbers adapt to your starting party. ${setupMode==='endless'?'Map themes are always random.':''}</p>`,`${button('← Mode','returnmode')}${button('Start battle','launch','primary')}`);$('draftDiff').onchange=ev=>draftDiff=ev.target.value;$('draftClassic').onchange=ev=>draftClassic=ev.target.checked;root.querySelector('[data-action="launch"]').disabled=party.size===0;return}
if(page==='classes'){let d=defs[classIndex],role=roles[d[1]];root.innerHTML=menuPanel('♜ Classes',`<div class="sub-grid"><div class="class-list">${defs.map((x,i)=>`<button class="party-card crown-button ${i===classIndex?'on':''}" data-action="class:${i}"><img src="${portraits[x[0]]}" alt=""><strong>${x[1]}</strong><small>${x[0]}</small></button>`).join('')}</div><div class="class-info"><img src="${largePortraits[d[0]]}" alt="${d[0]}"><div><h3>${d[1]}</h3><p><strong>${role[0]}</strong></p><p>${role[1]}</p><p>Weapon: ${d[2]}<br>Range: ${d[4]}–${d[5]}<br>Movement: ${d[7]}</p></div><div class="class-growth"><h3>Base stats &amp; growth</h3>${names.map((n,i)=>`<div class="growthline"><span class="staticon">${statIcons[i]}</span><span>${n} · ${d[8][i]}</span><strong>${d[9][i]}%</strong><div class="growthbar"><i style="width:${d[9][i]}%"></i></div></div>`).join('')}</div></div></div>`);return}
if(page==='leaderboard'){let rows=read(SCORES,[]).filter(x=>x.mode===scoreMode).sort((a,b)=>b.score-a.score||b.cleared-a.cleared).slice(0,20);root.innerHTML=menuPanel('♛ Leaderboard',`<div class="leader-tabs">${button('Campaign','scores:campaign',scoreMode==='campaign'?'on':'')}${button('Endless','scores:endless',scoreMode==='endless'?'on':'')}</div><div class="score-wrap"><table class="score-table"><thead><tr><th>Rank</th><th>Player</th><th>Cleared</th><th>Difficulty</th><th>Score</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.cleared}</td><td>${esc(r.difficulty)}</td><td>${r.score.toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="5">No scores yet. Win a battle to enter the rankings.</td></tr>'}</tbody></table></div><p class="menu-hint">Local rankings · saved on this browser. Score rewards completed battles, surviving heroes and difficulty. Online global rankings are not connected.</p>`);return}
if(page==='settings'){root.innerHTML=menuPanel('⚙ Settings',`<div class="setup-row"><strong>Player name</strong><input type="text" id="prefName" maxlength="24" value="${esc(prefs.name)}"></div><div class="setup-row"><strong>Default difficulty</strong><select id="prefDifficulty">${difficultyOptions(prefs.difficulty)}</select></div><div class="setup-row"><strong>Enemy turn speed</strong><select id="prefSpeed">${['Slow','Normal','Fast'].map(x=>`<option ${x===prefs.speed?'selected':''}>${x}</option>`).join('')}</select></div><div class="setup-row"><strong>Battlefield grid</strong><input id="prefGrid" type="checkbox" ${prefs.grid?'checked':''}></div><div class="setup-row"><strong>Classic mode by default</strong><input id="prefClassic" type="checkbox" ${prefs.classic?'checked':''}></div><div class="setup-row"><strong>Menu sound effects</strong><input id="prefSound" type="checkbox" ${prefs.sound?'checked':''}></div><div class="setup-row"><strong>Display</strong>${button('Toggle fullscreen','fullscreen')}</div><p class="menu-hint" id="settingsNotice">Changes save automatically on this device. Fullscreen depends on browser support.</p>`,button('How to play','help'));for(let [id,key] of [['prefName','name'],['prefDifficulty','difficulty'],['prefSpeed','speed'],['prefGrid','grid'],['prefClassic','classic'],['prefSound','sound']]){$(id).onchange=ev=>{prefs[key]=ev.target.type==='checkbox'?ev.target.checked:ev.target.value;if(key==='name')prefs.name=prefs.name.trim()||'Player';write(PREF,prefs);$('settingsNotice').textContent='Settings saved on this device.'}}return}
}
function playClick(){if(!prefs.sound)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let a=new A(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(540,a.currentTime);o.frequency.exponentialRampToValueAtTime(350,a.currentTime+.07);g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.09);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.1);o.onended=()=>a.close()}catch{}}
$('menuContent').addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b||b.disabled)return;playClick();let [a,v]=b.dataset.action.split(':');if(['home','campaign','endless','classes','leaderboard','settings'].includes(a)){choosePage(a);return}if(a==='chapter'){chapterPreview=+v;drawMenu()}if(a==='class'){classIndex=+v;drawMenu()}if(a==='scores'){scoreMode=v;drawMenu()}if(a==='setup'){setupMode=v;draftDiff=prefs.difficulty;draftClassic=prefs.classic;party=new Set(defs.map((_,i)=>i));choosePage('setup')}if(a==='party'){party.has(+v)?party.delete(+v):party.add(+v);drawMenu()}if(a==='all'){party=new Set(defs.map((_,i)=>i));drawMenu()}if(a==='clear'){party.clear();drawMenu()}if(a==='returnmode')choosePage(setupMode);if(a==='launch'){if(!party.size)return;let key=setupMode==='endless'?ENDSAVE:SAVE;if(read(key,null)){modal('<h2>Start a new run?</h2><p>This replaces the save for this mode only.</p><button id="confirmRun" class="primary">Start new</button> <button id="cancelRun">Cancel</button>');$('confirmRun').onclick=()=>{closeModal();launch()};$('cancelRun').onclick=closeModal}else launch()}if(a==='resume')resume(v);if(a==='help')$('howBtn').click();if(a==='fullscreen'){if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{$('settingsNotice').textContent='Fullscreen unavailable in this browser.'});else $('settingsNotice').textContent='Fullscreen unavailable in this browser.'}});
function battleDelay(){return {Slow:450,Normal:220,Fast:45}[prefs.speed]||220}
function randomMap(last,wave,partyCount){let options=themes.map((_,i)=>i).filter(i=>i!==last),theme=options[Math.floor(Math.random()*options.length)];let rows=Array.from({length:H},()=>Array(W).fill('.'));let rng=Math.random;for(let y=0;y<H;y++)for(let x=3;x<9;x++){let r=rng();rows[y][x]=r<.19?'f':r<.27?'#':r<.34?'~':r<.40?'t':'.'}let road=2+Math.floor(rng()*5);for(let x=0;x<W;x++)rows[road][x]='=';for(let y=0;y<H;y++){rows[y][2]='.';rows[y][9]='.'}let n=Math.min(14,Math.max(2,partyCount+Math.floor(wave/2)));let positions=[];for(let y=0;y<H;y++)for(let x=9;x<W;x++)positions.push([x,y]);for(let i=positions.length-1;i>0;i--){let j=Math.floor(rng()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}let types=['Raider','Archer','Mage','Guard','Captain'];let enemies=positions.slice(0,n).map(([x,y],i)=>[x,y,i===n-1&&wave%5===0?'Warlord':types[Math.floor(rng()*Math.min(types.length,3+Math.floor(wave/3)))]]);return {theme,name:themes[theme][0],objective:`Wave ${wave} · defeat all enemies`,rows:rows.map(r=>r.join('')),enemy:enemies}}
function applyTheme(){let b=$('board'),t=S.gameMode==='endless'?themes[S.battleMap.theme]:null;b.dataset.theme=t?String(S.battleMap.theme):'';b.classList.toggle('no-grid',!prefs.grid);if(t){['ground1','ground2','forest1','forest2','road1','road2','water1','water2','wall1','wall2'].forEach((k,i)=>b.style.setProperty('--'+k,t[2][i]));}}
function scaledEnemy(d,i){let ch=S.chapter,boost=S.gameMode==='endless'?Math.min(50,Math.floor(ch*.65)):ch;let u=enemy(d,i,boost),mult={Normal:1,Hard:1.15,Iron:1.3}[S.difficulty]||1;for(let k of ['maxhp','str','mag','def','res'])u[k]=Math.round(u[k]*mult);u.hp=u.maxhp;if(S.gameMode==='endless'&&ch>75){let extra=Math.floor((ch-75)/3);u.maxhp+=extra*2;u.hp=u.maxhp;u.str+=u.str?extra:0;u.mag+=u.mag?extra:0;u.def+=Math.floor(extra/2);u.res+=Math.floor(extra/2)}return u}
function launch(){S={gameMode:setupMode,runId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),playerName:prefs.name,difficulty:draftDiff,chapter:0,turn:1,phase:'player',status:'playing',classic:draftClassic,units:[...party].sort((a,b)=>a-b).map((i,j)=>makeHero(defs[i],j)),startingParty:party.size,cleared:0,score:0,log:[]};if(S.gameMode==='endless')S.battleMap=randomMap(-1,1,S.startingParty);setupChapter();showGame();save()}
function resume(v){let loaded=read(v==='endless'?ENDSAVE:SAVE,null);if(!loaded||!Array.isArray(loaded.units)||(v==='endless'?!loaded.battleMap:!maps[loaded.chapter])){modal('<h2>Save unavailable</h2><p>Start a new run.</p><button id="badSave">OK</button>');$('badSave').onclick=closeModal;return}S=loaded;S.gameMode=v;S.difficulty??='Normal';S.runId??=Date.now().toString(36);S.playerName??=prefs.name;S.startingParty??=S.units.filter(u=>u.side==='ally').length;S.cleared??=S.chapter;S.score??=S.cleared*1000;selected=S.units.find(u=>u.side==='ally'&&alive(u)&&!u.done)?.id||S.units.find(u=>u.side==='ally'&&alive(u))?.id;mode='move';busy=false;queue=[];showGame()}
function showMenu(){$('game').classList.add('hidden');$('menu').classList.remove('hidden');$('overlay').classList.add('hidden');choosePage('home')}
function recordVictory(){if((S.cleared||0)>S.chapter)return;S.cleared=S.chapter+1;let survivors=S.units.filter(u=>u.side==='ally'&&alive(u)).length;S.score=(S.score||0)+Math.round((1000+survivors*100+Math.max(0,20-S.turn)*10)*({Normal:1,Hard:1.25,Iron:1.5}[S.difficulty]||1));S.runId??=Date.now().toString(36);let list=read(SCORES,[]).filter(r=>r.id!==S.runId);list.push({id:S.runId,mode:S.gameMode||'campaign',name:S.playerName||prefs.name,cleared:S.cleared,difficulty:S.difficulty||'Normal',score:S.score});write(SCORES,list.sort((a,b)=>b.score-a.score).slice(0,200));save()}
function result(){let win=S.status==='won',complete=S.status==='complete',endless=S.gameMode==='endless';if(win||complete)recordVictory();modal(`<div class="eyebrow">${win||complete?'Victory':'Defeat'}</div><h2>${win?(endless?'Wave cleared':'Battle won'):complete?'The oath fulfilled':'The banner has fallen'}</h2><p>${win?(endless?'A different randomly generated battlefield awaits. Your heroes carry their growth forward.':'Your surviving heroes carry their growth into the next chapter.'):complete?'You have defeated all three enemy armies.':'Your warband was defeated.'}</p><p>Cleared: ${S.cleared||0} · Score: ${(S.score||0).toLocaleString()}</p><button id="resultBtn" class="primary">${win?(endless?'Next wave':'Next chapter'):'Main menu'}</button>${win?' <button id="exitResult">Save &amp; menu</button>':''}`);$('resultBtn').onclick=()=>{closeModal();if(win){S.chapter++;if(endless)S.battleMap=randomMap(S.battleMap.theme,S.chapter+1,S.startingParty);setupChapter();render();save();say('A new battle begins.')}else showMenu()};if(win)$('exitResult').onclick=()=>{save();showMenu()}}
$('menuBtn').onclick=()=>{if(!busy){save();showMenu()}};$('saveBtn').onclick=()=>say(save()?'Game saved on this device.':'Unable to save in this browser.');
// Keep campaign enemy count responsive to party size, without changing full-party campaign maps.
const originalSetup=setupChapter;setupChapter=function(){originalSetup();if(S.gameMode!=='endless'&&(S.startingParty||6)<6){let enemies=S.units.filter(u=>u.side==='enemy'),count=Math.max(2,Math.ceil(enemies.length*S.startingParty/6));let keep=new Set(enemies.slice(0,count).map(u=>u.id));S.units=S.units.filter(u=>u.side==='ally'||keep.has(u.id))}};
showMenu();

</script></body></html>
